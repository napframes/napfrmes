<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAP Frames</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ccc;
    }

    .frame {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4 / 5;
      margin: auto;
      padding: 18px;
      background: #b58b45;
      border: 10px solid #6d4c22;
    }

    .photo-area {
      width: 100%;
      height: 100%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      color: #777;
      font-size: 18px;
    }

    button {
      border: none;
      padding: 14px 25px;
      margin: 10px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    input[type="file"] {
      display: none;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>NAP Frames</h1>
  <p>आपकी फोटो • आपका फ्रेम</p>
</header>

<div class="container">

  <div class="product">

    <h2>Beautiful Photo Frame</h2>

    <div class="frame">
      <div class="photo-area">

        <span class="placeholder" id="placeholder">
          आपकी फोटो यहाँ दिखाई देगी
        </span>

        <img id="preview" alt="आपकी फोटो">

      </div>
    </div>

    <p>Size: 12 × 18</p>

    <div class="price">₹499</div>

    <label for="photo">
      <button>📸 अपनी फोटो लगाएँ</button>
    </label>

    <input type="file" id="photo" accept="image/*">

    <br>

    <button onclick="orderNow()">🛒 ऑर्डर करें</button>

  </div>

</div>

<script>

  const photoInput = document.getElementById("photo");
  const preview = document.getElementById("preview");
  const placeholder = document.getElementById("placeholder");

  photoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (file) {

      const imageURL = URL.createObjectURL(file);

      preview.src = imageURL;
      preview.style.display = "block";
      placeholder.style.display = "none";

    }

  });

  function orderNow() {
    alert("अगले चरण में यहाँ Customer Address और Payment आएगा।");
  }

</script>

</body>
</html>
