<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAP Frames | Photo Frame</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.container {
    max-width: 650px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    margin-top: 0;
}

/* FRAME */

.frame {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 4 / 5;
    margin: 20px auto;
    padding: 18px;
    background: linear-gradient(135deg, #d7a84d, #9b6b25);
    border: 12px solid #4d3015;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.photo-area {
    width: 100%;
    height: 100%;
    background: #eeeeee;
    overflow: hidden;
    position: relative;
    cursor: grab;
}

.photo-area:active {
    cursor: grabbing;
}

#preview {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    user-select: none;
    -webkit-user-drag: none;
}

.placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #777;
    padding: 20px;
}

/* BUTTON */

button {
    border: none;
    padding: 14px 20px;
    margin: 7px 3px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
    background: #111;
    color: white;
}

button:hover {
    opacity: 0.88;
}

.upload-btn {
    display: block;
    width: 100%;
    background: #8b5e20;
}

.order-btn {
    width: 100%;
    background: #198754;
    font-size: 18px;
    font-weight: bold;
}

#photoInput {
    display: none;
}

/* CONTROLS */

.controls {
    margin: 15px 0;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
}

.controls label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

#zoom {
    width: 100%;
}

/* PRICE */

.info {
    text-align: center;
    margin: 15px 0;
}

.price {
    font-size: 26px;
    font-weight: bold;
    color: #b57916;
}

/* FORM */

.form-box {
    margin-top: 25px;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

.form-box h3 {
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin: 7px 0 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

/* SUMMARY */

.summary {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

.summary p {
    margin: 7px 0;
}

/* MOBILE */

@media (max-width: 500px) {

    header h1 {
        font-size: 27px;
    }

    .container {
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

    .frame {
        padding: 12px;
        border-width: 9px;
    }
}
</style>
</head>

<body>

<header>
    <h1>NAP Frames</h1>
    <p>आपकी फोटो • आपका फ्रेम</p>
</header>

<div class="container">

<div class="card">

<h2>Beautiful Photo Frame</h2>

<!-- FRAME PREVIEW -->

<div class="frame">

    <div class="photo-area" id="photoArea">

        <span class="placeholder" id="placeholder">
            आपकी फोटो यहाँ दिखाई देगी
        </span>

        <img id="preview" alt="Customer Photo">

    </div>

</div>

<div class="info">
    <p><b>Frame Size:</b> 12 × 18 Inch</p>
    <div class="price">₹499</div>
</div>

<!-- PHOTO BUTTON -->

<button class="upload-btn" type="button" onclick="openPhotoPicker()">
    📸 अपनी फोटो लगाएँ
</button>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    onchange="showPhoto(event)"
>

<!-- MOVE / ZOOM -->

<div class="controls">

    <label>🔍 फोटो Zoom करें</label>

    <input
        type="range"
        id="zoom"
        min="1"
        max="3"
        step="0.01"
        value="1"
        oninput="updatePhoto()"
    >

    <p style="font-size:14px;color:#666;">
        फोटो को फ्रेम के अंदर माउस या उंगली से Move भी कर सकते हैं।
    </p>

</div>

<!-- CUSTOMER FORM -->

<div class="form-box">

<h3>📋 Customer Details</h3>

<input
    type="text"
    id="customerName"
    placeholder="अपना नाम"
>

<input
    type="tel"
    id="customerMobile"
    placeholder="Mobile Number"
    maxlength="10"
>

<textarea
    id="customerAddress"
    placeholder="पूरा Address"
></textarea>

<input
    type="text"
    id="customerCity"
    placeholder="City"
>

<input
    type="text"
    id="customerState"
    placeholder="State"
>

<input
    type="text"
    id="customerPincode"
    placeholder="Pincode"
    maxlength="6"
>

</div>

<!-- ORDER SUMMARY -->

<div class="summary">

<h3>🛒 Order Summary</h3>

<p><b>Frame:</b> Beautiful Photo Frame</p>
<p><b>Size:</b> 12 × 18 Inch</p>
<p><b>Price:</b> ₹660</p>

</div>

<!-- ORDER BUTTON -->

<button
    class="order-btn"
    type="button"
    onclick="orderNow()"
>
    🛒 Order Now
</button>

</div>

</div>

<script>

let selectedPhoto = false;

let scale = 1;
let posX = 0;
let posY = 0;

let dragging = false;
let startX = 0;
let startY = 0;


/* PHOTO PICKER */

function openPhotoPicker() {
    document.getElementById("photoInput").click();
}


/* SHOW PHOTO */

function showPhoto(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const imageURL = URL.createObjectURL(file);

    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");

    preview.src = imageURL;

    preview.style.display = "block";

    placeholder.style.display = "none";

    selectedPhoto = true;

    scale = 1;
    posX = 0;
    posY = 0;

    document.getElementById("zoom").value = 1;

    updatePhoto();
}


/* UPDATE PHOTO */

function updatePhoto() {

    scale = parseFloat(
        document.getElementById("zoom").value
    );

    const preview = document.getElementById("preview");

    preview.style.transform =
        "translate(" + posX + "px, " + posY + "px) scale(" + scale + ")";

}


/* MOUSE DRAG */

const photoArea = document.getElementById("photoArea");

photoArea.addEventListener("mousedown", function(e) {

    if (!selectedPhoto) return;

    dragging = true;

    startX = e.clientX - posX;
    startY = e.clientY - posY;

});


document.addEventListener("mousemove", function(e) {

    if (!dragging) return;

    posX = e.clientX - startX;
    posY = e.clientY - startY;

    updatePhoto();

});


document.addEventListener("mouseup", function() {

    dragging = false;

});


/* TOUCH DRAG FOR MOBILE */

photoArea.addEventListener(
    "touchstart",
    function(e) {

        if (!selectedPhoto) return;

        const touch = e.touches[0];

        dragging = true;

        startX = touch.clientX - posX;
        startY = touch.clientY - posY;

    },
    { passive: true }
);


photoArea.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging) return;

        const touch = e.touches[0];

        posX = touch.clientX - startX;
        posY = touch.clientY - startY;

        updatePhoto();

    },
    { passive: true }
);


photoArea.addEventListener(
    "touchend",
    function() {

        dragging = false;

    }
);


/* ORDER */

function orderNow() {

    const name =
        document.getElementById("customerName").value.trim();

    const mobile =
        document.getElementById("customerMobile").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const city =
        document.getElementById("customerCity").value.trim();

    const state =
        document.getElementById("customerState").value.trim();

    const pincode =
        document.getElementById("customerPincode").value.trim();


    if (!selectedPhoto) {

        alert("कृपया पहले अपनी फोटो लगाएँ।");

        return;
    }


    if (!name ||
        !mobile ||
        !address ||
        !city ||
        !state ||
        !pincode) {

        alert("कृपया सभी Customer Details भरें।");

        return;
    }


    if (mobile.length !== 10) {

        alert("कृपया सही 10 अंकों का Mobile Number डालें।");

        return;
    }


    if (pincode.length !== 6) {

        alert("कृपया सही 6 अंकों का Pincode डालें।");

        return;
    }


    /*
       IMPORTANT:
       नीचे अपना WhatsApp नंबर डालना है।
       Example:
       919876543210
    */

    const whatsappNumber = "91XXXXXXXXXX";


    const message =

        "🖼️ NAP FRAMES - NEW ORDER\n\n" +

        "👤 Customer Name: " + name + "\n" +

        "📱 Mobile: " + mobile + "\n\n" +

        "🏠 Address: " + address + "\n" +

        "🏙️ City: " + city + "\n" +

        "📍 State: " + state + "\n" +

        "📮 Pincode: " + pincode + "\n\n" +

        "🖼️ Frame: Beautiful Photo Frame\n" +

        "📏 Size: 12 × 18 Inch\n" +

        "💰 Price: ₹660\n\n" +

        "📸 Customer ने फोटो वेबसाइट पर लगाई है।";


    const whatsappNumber = "918127403844";

const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

window.open(whatsappURL, "_blank");

}

</script>

</body>
</html>
