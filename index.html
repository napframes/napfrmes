<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAP Frames | Photo Frames & Printing</title>

<meta name="description"
content="NAP Frames - Photo Frames, Cup, Magic Mirror, Cushion, T-Shirt, Chabi Ka Chhalla और Custom Printing Products.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:#fff;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.cart-button{
    border:0;
    background:#e53935;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.hero{
    background:linear-gradient(135deg,#111,#444);
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:5px 0 20px;
}

.category{
    white-space:nowrap;
    border:0;
    background:white;
    padding:12px 18px;
    border-radius:25px;
    cursor:pointer;
    box-shadow:0 2px 8px #ddd;
}

.category.active{
    background:#111;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px #ddd;
}

.product-image{
    width:100%;
    height:230px;
    object-fit:cover;
    background:#eee;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:7px;
}

.category-text{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.product select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:7px;
    margin-bottom:10px;
}

.add-button{
    width:100%;
    border:0;
    background:#111;
    color:white;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.cart{
    position:fixed;
    right:-430px;
    top:0;
    width:420px;
    max-width:95%;
    height:100vh;
    background:white;
    z-index:2000;
    padding:20px;
    overflow-y:auto;
    box-shadow:-5px 0 20px #999;
    transition:.3s;
}

.cart.open{
    right:0;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#ddd;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.cart-item{
    border-bottom:1px solid #ddd;
    padding:13px 0;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.quantity button{
    border:0;
    width:30px;
    height:30px;
    cursor:pointer;
    border-radius:5px;
}

.total{
    font-size:23px;
    font-weight:bold;
    margin:20px 0;
}

.customer input,
.customer textarea{
    width:100%;
    padding:11px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:7px;
}

.whatsapp{
    width:100%;
    border:0;
    background:#25D366;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    margin-top:10px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:30px;
}

@media(max-width:600px){

    .hero h1{
        font-size:31px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:170px;
    }

    .product-info{
        padding:10px;
    }

    .product-info h3{
        font-size:16px;
    }

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
NAP Frames
</div>

<button class="cart-button" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<h1>NAP Frames</h1>

<p>
Photo Frames • Gifts • Printing Products
</p>

</section>


<div class="container">

<h2 style="margin-bottom:15px;">
Our Products
</h2>

<div class="categories" id="categories"></div>

<div class="products" id="products"></div>

</div>


<!-- CART -->

<div class="cart" id="cart">

<div class="cart-top">

<h2>🛒 आपका Cart</h2>

<button class="close" onclick="closeCart()">
✕
</button>

</div>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="total">0</span>
</div>


<h3>Customer Details</h3>

<div class="customer">

<input
id="name"
type="text"
placeholder="पूरा नाम">

<input
id="mobile"
type="tel"
placeholder="Mobile Number">

<textarea
id="address"
rows="3"
placeholder="पूरा Address"></textarea>

<input
id="city"
type="text"
placeholder="City">

<input
id="state"
type="text"
placeholder="State">

<input
id="pincode"
type="text"
placeholder="Pincode">

<button
class="whatsapp"
onclick="sendOrder()">

📱 WhatsApp पर Order भेजें

</button>

</div>

</div>


<footer>

<p>© 2026 NAP Frames</p>

<p>
Photo Frames • Cup • Magic Mirror • Cushion • T-Shirt • Keychain
</p>

</footer>


<script>

/* ==================================================
   NAP FRAMES PRODUCTS
   ==================================================

   यहीं से Product का नाम,
   Category,
   Photo,
   Size और Price बदले जा सकते हैं.

   ================================================== */


const products = [

/* PHOTO FRAME */

{
id:1,

name:"Beautiful Photo Frame",

category:"Photo Frames",

image:"https://via.placeholder.com/600x600?text=Photo+Frame",

sizes:[
{size:"4 × 6 Inch",price:200},
{size:"6 × 8 Inch",price:300},
{size:"8 × 4 Inch",price:250},
{size:"8 × 8 Inch",price:350},
{size:"8 × 12 Inch",price:450},
{size:"12 × 18 Inch",price:660}
]
},


/* CUP */

{
id:2,

name:"Custom Photo Cup",

category:"Cup",

image:"https://via.placeholder.com/600x600?text=Photo+Cup",

sizes:[
{size:"Normal Cup",price:199}
]
},


/* MAGIC MIRROR */

{
id:3,

name:"Magic Mirror",

category:"Magic Mirror",

image:"https://via.placeholder.com/600x600?text=Magic+Mirror",

sizes:[
{size:"Small",price:399},
{size:"Medium",price:599},
{size:"Large",price:799}
]
},


/* CUSHION */

{
id:4,

name:"Custom Photo Cushion",

category:"Cushion",

image:"https://via.placeholder.com/600x600?text=Cushion",

sizes:[
{size:"12 × 12 Inch",price:299},
{size:"16 × 16 Inch",price:399}
]
},


/* T-SHIRT */

{
id:5,

name:"Custom Photo T-Shirt",

category:"T-Shirt",

image:"https://via.placeholder.com/600x600?text=T-Shirt",

sizes:[
{size:"S",price:499},
{size:"M",price:499},
{size:"L",price:499},
{size:"XL",price:499},
{size:"XXL",price:549}
]
},


/* KEYCHAIN */

{
id:6,

name:"Photo Chabi Ka Chhalla",

category:"Chabi Ka Chhalla",

image:"https://via.placeholder.com/600x600?text=Keychain",

sizes:[
{size:"Normal",price:99}
]
}

];


/* CART */

let cart=[];


/* CATEGORY */

function showCategories(){

let categories=[
"All",
...new Set(products.map(p=>p.category))
];

let html="";

categories.forEach((category,index)=>{

html+=`

<button
class="category ${index===0?"active":""}"
onclick="filterProducts('${category}',this)">

${category}

</button>

`;

});

document.getElementById("categories").innerHTML=html;

}

showCategories();


/* PRODUCTS */

function displayProducts(list=products){

let html="";

list.forEach(product=>{

let options="";

product.sizes.forEach((item,index)=>{

options+=`

<option value="${index}">

${item.size} - ₹${item.price}

</option>

`;

});


html+=`

<div class="product">

<img
class="product-image"
src="${product.image}"
alt="${product.name}">

<div class="product-info">

<div class="category-text">
${product.category}
</div>

<h3>
${product.name}
</h3>

<div class="price">
₹<span id="price-${product.id}">
${product.sizes[0].price}
</span>
</div>

<select
id="size-${product.id}"
onchange="changePrice(${product.id})">

${options}

</select>

<button
class="add-button"
onclick="addToCart(${product.id})">

🛒 Add to Cart

</button>

</div>

</div>

`;

});

document.getElementById("products").innerHTML=html;

}

displayProducts();


/* FILTER */

function filterProducts(category,button){

document
.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

if(category==="All"){

displayProducts(products);

}else{

displayProducts(
products.filter(p=>p.category===category)
);

}

}


/* PRICE */

function changePrice(id){

let product=products.find(p=>p.id===id);

let select=document.getElementById("size-"+id);

let selected=product.sizes[select.value];

document.getElementById("price-"+id)
.innerText=selected.price;

}


/* ADD CART */

function addToCart(id){

let product=products.find(p=>p.id===id);

let select=document.getElementById("size-"+id);

let selected=product.sizes[select.value];

let existing=cart.find(
item=>item.id===id &&
item.size===selected.size
);

if(existing){

existing.quantity++;

}else{

cart.push({

id:id,

name:product.name,

category:product.category,

size:selected.size,

price:selected.price,

quantity:1

});

}

updateCart();

alert("Product Cart में जोड़ दिया गया ✅");

}


/* CART */

function updateCart(){

let html="";

let total=0;

let count=0;

cart.forEach((item,index)=>{

let itemTotal=
item.price*item.quantity;

total+=itemTotal;

count+=item.quantity;

html+=`

<div class="cart-item">

<strong>
${item.name}
</strong>

<p>
Size: ${item.size}
</p>

<p>
₹${item.price} × ${item.quantity}
</p>

<div class="quantity">

<button
onclick="changeQuantity(${index},-1)">
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="changeQuantity(${index},1)">
+
</button>

<button
onclick="removeItem(${index})">
🗑️
</button>

</div>

</div>

`;

});

if(cart.length===0){

html="<p>आपका Cart खाली है।</p>";

}

document.getElementById("cartItems").innerHTML=html;

document.getElementById("total").innerText=total;

document.getElementById("cartCount").innerText=count;

}


/* QUANTITY */

function changeQuantity(index,value){

cart[index].quantity+=value;

if(cart[index].quantity<=0){

cart.splice(index,1);

}

updateCart();

}


/* REMOVE */

function removeItem(index){

cart.splice(index,1);

updateCart();

}


/* OPEN CART */

function openCart(){

document
.getElementById("cart")
.classList.add("open");

}


/* CLOSE CART */

function closeCart(){

document
.getElementById("cart")
.classList.remove("open");

}


/* WHATSAPP ORDER */

function sendOrder(){

if(cart.length===0){

alert("पहले कोई Product Cart में जोड़ें।");

return;

}


let name=
document.getElementById("name").value.trim();

let mobile=
document.getElementById("mobile").value.trim();

let address=
document.getElementById("address").value.trim();

let city=
document.getElementById("city").value.trim();

let state=
document.getElementById("state").value.trim();

let pincode=
document.getElementById("pincode").value.trim();


if(
!name ||
!mobile ||
!address ||
!city ||
!state ||
!pincode
){

alert("कृपया Customer Details पूरी भरें।");

return;

}


let message=
"*NAP Frames - New Order*%0A%0A";


message+="*Customer Details*%0A";

message+="Name: "+
encodeURIComponent(name)+
"%0A";

message+="Mobile: "+
encodeURIComponent(mobile)+
"%0A";

message+="Address: "+
encodeURIComponent(address)+
"%0A";

message+="City: "+
encodeURIComponent(city)+
"%0A";

message+="State: "+
encodeURIComponent(state)+
"%0A";

message+="Pincode: "+
encodeURIComponent(pincode)+
"%0A%0A";


message+="*Order Details*%0A";


let total=0;


cart.forEach((item,index)=>{

let itemTotal=
item.price*item.quantity;

total+=itemTotal;

message+=
(index+1)+". "+
encodeURIComponent(item.name)+
" | "+
encodeURIComponent(item.size)+
" | Qty: "+
item.quantity+
" | ₹"+
itemTotal+
"%0A";

});


message+=
"%0A*Total: ₹"+
total+
"*";


/* आपका WhatsApp Number */

let whatsappNumber=
"918127403844";


let url=
"https://wa.me/"+
whatsappNumber+
"?text="+
message;


window.open(url,"_blank");

}


updateCart();

</script>

</body>
</html>
