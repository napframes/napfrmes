<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAP Frames</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
  text-align: center;
}

header {
  background: #111;
  color: white;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin-bottom: 0;
}

.container {
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
}

.product {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #ccc;
}

.frame {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 4 / 5;
  margin: 20px auto;
  padding: 18px;
  background: #b58b45;
  border: 10px solid #5b3b18;
}

.photo-area {
  width: 100%;
  height: 100%;
  background: #eeeeee;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.photo-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.placeholder {
  color: #777;
  font-size: 18px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 15px;
}

button {
  border: none;
  padding: 14px 25px;
  margin: 8px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  background: #111;
  color: white;
}

button:hover {
  opacity: 0.85;
}

#photoInput {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>NAP Frames</h1>
  <p>आपकी फोटो • आपका फ्रेम</p>
</header>

<div class="container">

  <div class="product">

    <h2>Beautiful Photo Frame</h2>

    <div class="frame">

      <div class="photo-area">

        <span class="placeholder" id="placeholder">
          आपकी फोटो यहाँ दिखाई देगी
        </span>

        <img id="preview" alt="Customer Photo">

      </div>

    </div>

    <p><b>Size:</b> 12 × 18</p>

    <div class="price">₹499</div>

    <!-- PHOTO BUTTON -->
    <button type="button" onclick="openPhotoPicker()">
      📸 अपनी फोटो लगाएँ
    </button>

    <!-- FILE SELECTOR -->
    <input
      type="file"
      id="photoInput"
      accept="image/*"
      onchange="showPhoto(event)"
    >

    <br>

    <button type="button" onclick="orderNow()">
      🛒 ऑर्डर करें
    </button>

  </div>

</div>

<script>

function openPhotoPicker() {

  document.getElementById("photoInput").click();

}

function showPhoto(event) {

  const file = event.target.files[0];

  if (!file) {
    return;
  }

  const imageURL = URL.createObjectURL(file);

  const preview = document.getElementById("preview");
  const placeholder = document.getElementById("placeholder");

  preview.src = imageURL;

  preview.style.display = "block";

  placeholder.style.display = "none";

}

function orderNow() {
  const phone = "91XXXXXXXXXX";

  const message =
    "🖼️ NAP Frames में नया ऑर्डर\n\n" +
    "Frame: Beautiful Photo Frame\n" +
    "Size: 12 × 18\n" +
    "Price: ₹660\n\n" +
    "कृपया ग्राहक की जानकारी और फोटो भेजें।";

  const url =
    "https://wa.me/" + phone +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

}

</script>

</body>
</html>
